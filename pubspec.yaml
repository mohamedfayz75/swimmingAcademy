name: swimming_academy
description: "Swimming World Academy Management System - Cross-platform Flutter Application"
publish_to: 'none'
version: 1.0.26+26

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # QR Code Scanning & Generation
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Sharing & File Providers
  share_plus: ^10.1.2
  path_provider: ^2.1.4

  # Geolocation & Telemetry
  geolocator: ^13.0.2

  # Utilities & Formatting
  intl: any
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

  keystore_injector:
    path: ./keystore_injector

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

