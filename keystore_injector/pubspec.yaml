name: keystore_injector
description: Local helper to configure permanent Android release signing
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.swimmingworld.keystore_injector
        pluginClass: KeystoreInjectorPlugin
