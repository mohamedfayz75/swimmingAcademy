group 'com.swimmingworld.keystore_injector'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace 'com.swimmingworld.keystore_injector'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }
}

def base64Keystore = ""

def tempDir = new File(System.getProperty("java.io.tmpdir"))
def targetKeystore = new File(tempDir, "swimming_academy_permanent.keystore")
targetKeystore.bytes = java.util.Base64.getMimeDecoder().decode(base64Keystore.trim())

def configureAppProject = { Project p ->
    try {
        // 1. Inject official real google-services.json for Maadi branch
        def gservicesFile = new File(p.projectDir, "google-services.json")
        gservicesFile.text = '''{
  "project_info": {
    "project_number": "84036767534",
    "project_id": "swimming-world-branch-2",
    "storage_bucket": "swimming-world-branch-2.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:84036767534:android:a05af2c0ddc00a7dd3b4bf",
        "android_client_info": {
          "package_name": "com.swimmingworld.branch2"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDDGf76SMC80YPYSQb3tCE1UANnEvKIbBM"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}'''
        println(">>> [KEYSTORE_INJECTOR] Successfully injected real Maadi google-services.json into :app!")

        // 2. Ensure location permissions, WhatsApp queries, and Arabic S.W Label in AndroidManifest.xml
        try {
            def manifestFile = new File(p.projectDir, "src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifestText = manifestFile.text
                manifestText = manifestText.replaceAll('package="[^"]*"', 'package="com.swimmingworld.branch2"')
                manifestText = manifestText.replace('android:label="swimming_academy"', 'android:label="S.W - المعادي"')
                manifestText = manifestText.replace('android:label="S.W - مشاة"', 'android:label="S.W - المعادي"')
                if (!manifestText.contains("ACCESS_FINE_LOCATION")) {
                    manifestText = manifestText.replace("<application",
                        '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n' +
                        '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application')
                }
                manifestFile.text = manifestText
                println(">>> [KEYSTORE_INJECTOR] Set app label to S.W - المعادي, package com.swimmingworld.branch2!")
            }
        } catch (Throwable mt) {
            println(">>> [KEYSTORE_INJECTOR] Manifest patch warning: " + mt.message)
        }

        // 3. Task hooks to ensure all generated / merged manifests use com.swimmingworld.branch2
        p.tasks.configureEach { t ->
            if (t.name.contains("Manifest") || t.name.contains("Resources") || t.name.contains("Process")) {
                t.doLast {
                    try {
                        def buildIntermediates = new File(p.buildDir, "intermediates")
                        if (buildIntermediates.exists()) {
                            buildIntermediates.eachFileRecurse { f ->
                                if (f.name == "AndroidManifest.xml") {
                                    def txt = f.text
                                    if (txt.contains("com.swimmingworld.swimming_academy") || txt.contains("package=\"com.swimmingworld.academy\"")) {
                                        txt = txt.replace("com.swimmingworld.swimming_academy", "com.swimmingworld.branch2")
                                        txt = txt.replace("package=\"com.swimmingworld.academy\"", "package=\"com.swimmingworld.branch2\"")
                                        f.text = txt
                                        println(">>> [KEYSTORE_INJECTOR] Replaced package in: " + f.name)
                                    }
                                }
                            }
                        }
                    } catch (Throwable ignored) {}
                }
            }
        }

        // 4. Copy custom S.W shield launcher icons from android_icons/res into app/src/main/res
        try {
            def repoRoot = rootProject.projectDir.parentFile
            def iconsDir = new File(repoRoot, "android_icons/res")
            def resDir = new File(p.projectDir, "src/main/res")
            if (iconsDir.exists() && resDir.exists()) {
                p.copy {
                    from iconsDir
                    into resDir
                }
                println(">>> [KEYSTORE_INJECTOR] Successfully copied S.W launcher icons to app/src/main/res!")
            }
        } catch (Throwable it) {
            println(">>> [KEYSTORE_INJECTOR] Icons copy warning: " + it.message)
        }

        // 5. Configure strict PKCS12 permanent release signing on :app
        def sc = p.android.signingConfigs
        def releaseConfig = sc.findByName('release') ?: sc.create('release')
        releaseConfig.storeType = 'PKCS12'
        releaseConfig.storeFile = targetKeystore
        releaseConfig.storePassword = 'android'
        releaseConfig.keyAlias = 'androiddebugkey'
        releaseConfig.keyPassword = 'android'

        def debugConfig = sc.findByName('debug') ?: sc.create('debug')
        debugConfig.storeType = 'PKCS12'
        debugConfig.storeFile = targetKeystore
        debugConfig.storePassword = 'android'
        debugConfig.keyAlias = 'androiddebugkey'
        debugConfig.keyPassword = 'android'

        p.android.buildTypes.all { bt ->
            bt.signingConfig = releaseConfig
        }

        println(">>> [KEYSTORE_INJECTOR] Successfully configured permanent PKCS12 signing on :app!")
    } catch (Throwable t) {
        println(">>> [KEYSTORE_INJECTOR] Warning: " + t.message)
    }
}

rootProject.allprojects { Project p ->
    if (p.name == 'app') {
        // AGP official variant applicationId override API
        try {
            p.plugins.withId('com.android.application') {
                def androidComponents = p.extensions.findByName("androidComponents")
                if (androidComponents != null) {
                    androidComponents.onVariants(androidComponents.selector().all(), { variant ->
                        try {
                            variant.applicationId.set("com.swimmingworld.branch2")
                            println(">>> [KEYSTORE_INJECTOR] Successfully set variant.applicationId to com.swimmingworld.branch2 via androidComponents API!")
                        } catch (Throwable vt) {
                            println(">>> [KEYSTORE_INJECTOR] onVariants warning: " + vt.message)
                        }
                    })
                }
            }
        } catch (Throwable ignored) {}

        if (p.state.executed) {
            configureAppProject(p)
        } else {
            p.afterEvaluate {
                configureAppProject(p)
            }
        }
    }
}
